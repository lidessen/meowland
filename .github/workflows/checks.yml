name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Build, format, lint, types and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run --cwd apps/docs build
      # format:check → lint → typecheck → test; typecheck and tests consume the built dist.
      - run: bun run check

  plan:
    name: Plan browser suites
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The diff against the pull request's base needs the history between them.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      # A pull request runs the suites its changes reach; a push to main or a manual run runs all.
      - id: plan
        run: bun scripts/browser-suites.ts ${{ github.event_name == 'pull_request' && format('--base {0}', github.event.pull_request.base.sha) || '' }} >> "$GITHUB_OUTPUT"

  browser:
    name: Browser (${{ matrix.suite }})
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      # Use the Playwright-bundled Chromium instead of each config's system Chrome default.
      PLAYWRIGHT_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run build
      # Example works serve their own build output.
      - if: matrix.prepare
        run: ${{ matrix.prepare }}
      - run: bun node_modules/@playwright/test/cli.js install --with-deps chromium
      - run: bun node_modules/@playwright/test/cli.js test --config ${{ matrix.config }} ${{ matrix.args }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.suite }}
          path: |
            **/test-results/
            !**/node_modules/**
          retention-days: 7
          if-no-files-found: ignore
